spring.application.name=smart-grocery-backend
server.port=8080

# Database Configuration (XAMPP MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_grocery?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT settings
jwt.secret=9a7c3b8f2d5e6a1c4b7e8d0f3a6b9c2e5f8a1d4b7c0e3f6a9b2d5e8c1f4a7b0d
jwt.expiration-ms=86400000